<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colourhand.</title>
</head>
<body>
    <div id="app" class="app">
        <!-- ===================================================== PRELOADER ===================================================== -->
        <div id="preloader">
            <div class="loader-logo">Colourhand.</div>
            <div class="loader-percent" id="loaderPercent">0%</div>
        </div>

        <!-- ===================================================== HEADER ===================================================== -->
        <header class="header">
           <nav class="nav">
                <div class="nav-left">
                    <div class="logo">Colourhand.</div>
                </div>

                <div class="nav-center">
                </div>

                <div class="nav-right">
                    <a href="/#" aria-label="Github">
                        <span class="nav-github">
                            <svg width="26" aria-hidden="true" height="26" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.8 1.18 1.82 1.18 3.08 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14 0 1.54-.01 2.79-.01 3.17 0 .3.2.66.79.55A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
                            </svg>
                        </span>
                    </a>
                </div>
           </nav>
        </header>

        <!-- ===================================================== MAIN WRAPPER ===================================================== -->
       <div class="main-wrapper">
            <div class="bg-wrapper" id="bg-wrapper">
               <div class="hand-img-wrap" id="hand-img-wrap">
                 <div class="hand-img"><img id="hero-hand-image" src aria-label="hand-img"/></div>
               </div>
            </div>

            <!-- Panel Component -->
            <div class="panel">
                <p class="panel-eyebrow ink">Generated Shade</p>

                 <div class="panel-hex-row">
                    <div class="panel-hex ink" id="hex-value">#0F1412</div>

                    <button class="panel-copy" id="copy-btn" type="button" aria-label="Скопировать HEX">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>
                </div>

                <p class="panel-codes ink" id="color-codes">
                    <span>RGB 15, 20, 18</span>
                    <span>HSL 158, 14%, 7%</span>
                </p>
        
                <!-- <div class="panel-swatches" id="swatches"></div> -->

                <button class="panel-generate" id="generate-btn" type="button">
                    Generate
                </button>
            </div>
       </div>

       <div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
